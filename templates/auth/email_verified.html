{% extends "auth/base_auth.html" %}
{% block title %}Email Verified{% endblock %}
{% block content %}
{% if error %}
<h1 class="auth-card__title">Verification Failed</h1>
<div class="auth-alert auth-alert--error">{{ error }}</div>
<p class="auth-card__footer"><a href="/login">Log in</a> or <a href="/signup">sign up again</a></p>
{% else %}
<h1 class="auth-card__title">Email Verified</h1>
<div class="auth-alert auth-alert--success">Your email has been verified. You're logged in.</div>
<p style="margin-top:18px;">
  <a href="{{ next_url or '/dashboard' }}" class="btn btn--primary" style="display:inline-block;padding:10px 24px;">Continue</a>
</p>
<script>
  setTimeout(function(){ window.location.href = "{{ next_url or '/dashboard' }}"; }, 1500);
</script>
{% endif %}
{% endblock %}
